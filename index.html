<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Rankings Web</title>
<meta http-equiv="refresh" content="0; url=llm-rankings.html">
<link rel="canonical" href="llm-rankings.html">
<style>
:root{--card:#FF5722;--bg:#fafafa;--txt:#111;--sub:rgba(0,0,0,.55)}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--txt:#f2f2f2;--sub:rgba(255,255,255,.6)}}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:var(--bg);color:var(--txt);font-family:'Space Grotesk',system-ui,sans-serif}
.sp{width:40px;height:40px;border:3px solid var(--sub);border-top-color:var(--card);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
p{font-size:.95rem;color:var(--sub)}
a{color:var(--card);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="sp"></div>
<p>正在进入排行榜… 若未自动跳转，<a href="llm-rankings.html">点此进入</a></p>
<script>location.replace('llm-rankings.html' + location.search + location.hash);</script>
</body>
</html>
